[env:lilygo-t5-s3-epaper-pro]
extends = esp32s3_base
board = lilygo-t5-s3-epaper-pro
board_check = true
board_build.partitions = default_16MB.csv
upload_protocol = esptool
monitor_speed = 115200

custom_meshtastic_hw_model = 123
custom_meshtastic_hw_model_slug = LILYGO_T5_S3_EPAPER_PRO
custom_meshtastic_architecture = esp32-s3
custom_meshtastic_actively_supported = true
custom_meshtastic_display_name = LILYGO T5 S3 E-Paper Pro
custom_meshtastic_tags = LilyGo, E-Paper, GPS, LoRa, Touch

build_unflags =
  -D CORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG
  -D LOG_LOCAL_LEVEL=ESP_LOG_DEBUG
  -flto

build_flags =
  ${esp32s3_base.build_flags}
  -D LILYGO_T5_S3_EPAPER_PRO
  -I variants/esp32s3/lilygo_t5_s3_epaper_pro
  -D DEBUG_HEAP=1
  ; Halt on panic to capture logs
  -D CONFIG_ESP_SYSTEM_PANIC_PRINT_HALT
  ; Verbose logging to debug crashes
  -D CORE_DEBUG_LEVEL=5
  -D LOG_LOCAL_LEVEL=ESP_LOG_VERBOSE
  ; E-Paper display via epdiy library (ED047TC1 4.7" 960x540)
  -D HAS_SCREEN=1
  -D USE_EINK=1
  -D USE_EINK_EPDIY=1
  -D EINK_WIDTH=540
  -D EINK_HEIGHT=960
  ; LoRa SX1262
  -D USE_SX1262
  -D LORA_SCK=14
  -D LORA_MISO=21
  -D LORA_MOSI=13
  -D LORA_CS=46
  -D LORA_RESET=1
  -D LORA_DIO1=10
  -D LORA_BUSY=47
  ; GPS
  -D HAS_GPS=1
  -D GPS_RX_PIN=44
  -D GPS_TX_PIN=43
  ; I2C Bus
  -D I2C_SDA=39
  -D I2C_SCL=40
  ; Button (GPIO 0, active low with internal pullup)
  -D HAS_BUTTON=1
  -D BUTTON_PIN=0
  -D BUTTON_NEED_PULLUP
  ; Touch GT911 (I2C address 0x5D, uses Wire1 to avoid epdiy conflicts)
  -D HAS_TOUCHSCREEN=1
  -D SCREEN_TOUCH_INT=3
  -D SCREEN_TOUCH_RST=9
  -D TOUCH_SLAVE_ADDRESS=0x5D
  -D USE_VIRTUAL_KEYBOARD=1
  ; PSRAM cache fix for older ESP-IDF
  -mfix-esp32-psram-cache-issue
  ; Battery management BQ25896 (charger) + BQ27220 (fuel gauge)
  ; I2C bus shared with epdiy - protected by i2cLock mutex
  -D HAS_PPM=1
  -D HAS_BQ27220=1
  -D BQ27220_DESIGN_CAPACITY=1500
  ; Power-saving defaults for e-paper device:
  ; - WiFi off by default (major power drain, prevents light sleep)
  ; - Power saving enabled (enables light sleep transitions in PowerFSM)
  ; - GPS update every hour (device is mostly stationary)
  ; - Screen on 30s (e-paper holds image, short active period before sleep)
  ; - LoRa region ANZ, modem preset LONG_FAST
  -D USERPREFS_NETWORK_WIFI_ENABLED=false
  -D USE_POWERSAVE
  -D 'USERPREFS_CONFIG_GPS_UPDATE_INTERVAL=3600'
  -D 'USERPREFS_CONFIG_LORA_REGION=meshtastic_Config_LoRaConfig_RegionCode_ANZ'
  -D 'USERPREFS_LORACONFIG_MODEM_PRESET=meshtastic_Config_LoRaConfig_ModemPreset_LONG_FAST'

; Include variant.cpp for GT911 touch initialization
build_src_filter =
  ${esp32s3_base.build_src_filter}
  +<../variants/esp32s3/lilygo_t5_s3_epaper_pro>

lib_deps =
  ${esp32s3_base.lib_deps}
  ; epdiy library for parallel e-paper displays (epd_board_v7, ED047TC1)
  ; Using epdiy_upstream (patched for I2C bus sharing) from lib/ folder
  ; BQ27220 fuel gauge library
  ; renovate: datasource=git-refs depName=BQ27220 packageName=https://github.com/mverch67/BQ27220 gitBranch=main
  https://github.com/mverch67/BQ27220/archive/07d92be846abd8a0258a50c23198dac0858b22ed.zip
  ; SensorLib for PCF8563 RTC
  lewisxhe/SensorLib@0.3.3
